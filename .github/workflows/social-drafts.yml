name: Threads drafts (Phase 0 - generate only, no posting)

# 毎日、Threads の下書きを2本（紹介・問いかけ）生成して social/drafts/ にコミットするだけ
# （まだ投稿はしない＝承認ゲート）。
# 🔴 2026-09-21、X と Instagram をやめた（反応が無く、投稿もしていなかった）。
#    Instagramカードの生成（render-ig-card.mjs）も一緒に外した。戻すなら git 履歴から。
# スケジュール(cron)はデフォルトブランチ(claude/family-event-planning-rfwmo8)でのみ発火する。
on:
  schedule:
    # 🔴 2026-10-15: 「0 22 * * *」（07:00 JST）にしていたが、実際に動くのは毎日 09:40〜11:50 JST だった
    #    （GitHub の定時実行は、混む時間帯だと数時間遅れる）。朝7時の投稿に間に合わないので、
    #    02:17 JST（17:17 UTC）に早める。半端な分にしたのは、毎時0分の混雑を避けるため。
    # 🔴 2026-11-01: 10/28〜11/1 に4回、混雑（503）と上限（429）で全モデル失敗した。**2回動かす**（00:17 と 02:17 JST）。
    #    その日の下書きが出来ていれば、2回目は何もしない（手で書いた日も上書きしない）。
    #    ⚠️ 実際に動くのは指定の3〜4時間あと（10/30 は 06:29、10/31 は 05:27 JST に動いた）。
    #    だから「後ろにもう1回」ではなく「前にもう1回」。00:17 より前にすると JST の日付が前日になるので、ここが下限
    - cron: "17 15 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "その日の下書きがあっても作り直す"
        type: boolean
        default: false
      dry_run:
        description: "ファイルに書かず、ログに出すだけ（動くかの確認）"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-drafts
  cancel-in-progress: false

jobs:
  drafts:
    runs-on: ubuntu-latest
    # 混雑のときは待って試し直す（1モデル最大5分）。それでも終わらなければ止める
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          FORCE: ${{ inputs.force && '1' || '' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: node scripts/social/generate-drafts.mjs
      - name: Commit drafts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add social/
          if git diff --cached --quiet; then
            echo "変更なし（ドラフトの更新なし）"
          else
            git commit -m "social: daily SNS drafts ($(TZ=Asia/Tokyo date +%F))"
            git push
          fi
