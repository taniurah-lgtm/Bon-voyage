name: Update homepage preview from the latest issue

# 配信ずみの号で、ホームページの「最新号のプレビュー」を書き換えて公開する。
#
# ★見るのは reports/free/sent.log（実際にLINEへ送った号の記録）であって、
#   下書きそのものではない。以前は reports/free/** を見ていたため、
#   配信案を置いた瞬間にサイトが今週号を出していた。
#   2026-09-09、下書きが 07:49 に公開され、LINEに届いたのは 09:00。
#   1時間ほどホームページが読者より先だった。紙面を最初に受け取るのは読者。
on:
  push:
    branches: [claude/family-event-planning-rfwmo8]
    paths:
      - "reports/free/sent.log"
      - "scripts/update-homepage-preview.mjs"
      - ".github/workflows/update-homepage-preview.yml"
  workflow_dispatch: {}

# 🔴 2026-10-14: ここで docs/homepage をそのまま公開していたため、
#   配信の直後に「Deploy homepage」（年齢別ページ・カレンダー等を組んでから出す）と競争になり、
#   こちらが後から終わると**年齢別ページ（/week/）がまるごと消えた**（/week/ は組み立てて作るもので、リポジトリに無い）。
#   10/14号は LINE を受け取った読者がページを開けなかった（09:17〜）。
#   → **ここでは公開しない。**プレビューを書き換えて commit したら、「Deploy homepage」を起動して、そちらに組み立てと公開を任せる。
permissions:
  contents: write
  actions: write

concurrency:
  group: homepage-preview
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # ★2026-09-18: ブランチを1本にしたので、チェックアウトは1回で済む。
      #   以前は台帳(rfwmo8)とホームページ(yefv9l)が別ブランチにあり、
      #   両方チェックアウトして片方からもう片方へ push していた。
      - uses: actions/checkout@v4
        with:
          ref: claude/family-event-planning-rfwmo8
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Rewrite the preview block
        id: rewrite
        run: node scripts/update-homepage-preview.mjs docs/homepage/index.html
      - name: Commit homepage change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/homepage/index.html
          if git diff --cached --quiet; then
            echo "変更なし（プレビューは最新）"
          else
            git commit -m "homepage: refresh latest-issue preview (auto)"
            git push origin HEAD:claude/family-event-planning-rfwmo8
          fi
      # GITHUB_TOKEN の push は他のワークフローを起動しない。ただし workflow_dispatch なら起動できる。
      # 公開は「Deploy homepage」だけが行う（年齢別ページ・カレンダー・園庭開放などを組んでから出す）。
      - name: Ask "Deploy homepage" to build and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-homepage.yml --ref claude/family-event-planning-rfwmo8
