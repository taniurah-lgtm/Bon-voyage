<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>名刺 表（HP QR）｜ぼんぼやーじゅ通信</title>
<style>
/* 入稿用: 仕上がり 横91×55mm ＋ 塗り足し3mm = 97×61mm、トンボなし。文字/QRは端から6mm以内に置く。 */
@page{size:97mm 61mm;margin:0;}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:97mm;height:61mm;}
body{font-family:"IPAPGothic","IPAGothic","Noto Color Emoji",sans-serif;-webkit-font-smoothing:antialiased;}
.card{position:relative;width:97mm;height:61mm;overflow:hidden;background:#FBFAF5;color:#34434C;}
.content{position:absolute;top:6mm;left:6mm;right:6mm;bottom:6mm;display:flex;gap:5mm;}
.left{flex:1;display:flex;flex-direction:column;}
.eyebrow{font-style:italic;font-size:7pt;color:#EBA24A;letter-spacing:.4pt;}
.brand{font-size:16pt;font-weight:800;letter-spacing:.4pt;line-height:1.1;margin-top:.4mm;}
.sub{font-size:7.5pt;color:#63727B;margin-top:1mm;}
.tag{font-size:7pt;color:#34434C;margin-top:auto;line-height:1.55;}
.url{font-size:8.5pt;font-weight:800;color:#2C7C9E;margin-top:1.6mm;letter-spacing:.2pt;}
.right{width:23mm;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.qrbox{width:23mm;height:23mm;background:#fff;border:.25mm solid #e6e0d4;border-radius:1.4mm;padding:1mm;}
.qrbox img{width:100%;height:100%;display:block;}
.qrcap{font-size:6pt;color:#63727B;margin-top:1mm;text-align:center;}
.hills{position:absolute;left:0;bottom:0;width:97mm;height:5mm;}
</style></head><body>
<div class="card">
  <div class="content">
    <div class="left">
      <div class="eyebrow">Bon Voyage,</div>
      <div class="brand">ぼんぼやーじゅ通信</div>
      <div class="sub">花小金井まわりの 週末おでかけ便</div>
      <div class="tag">未就学〜小学生のご家庭へ🎈<br>週末のおでかけ情報を無料でお届け</div>
      <div class="url">bonvoya.nicomaru.tokyo</div>
    </div>
    <div class="right">
      <div class="qrbox"><img src="assets/qr-hp.png" alt="ホームページQR"></div>
      <div class="qrcap">スマホでサイトへ</div>
    </div>
  </div>
  <svg class="hills" viewBox="0 0 400 20" preserveAspectRatio="none"><path d="M0,12 Q110,3 220,8 T400,6 L400,20 L0,20 Z" fill="#CFE7D0"/><path d="M0,15 Q130,8 260,12 T400,12 L400,20 L0,20 Z" fill="#A6CE8B"/></svg>
</div></body></html>
