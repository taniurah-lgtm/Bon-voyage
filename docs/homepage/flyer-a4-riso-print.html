<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>ぼんぼやーじゅ通信 A4チラシ 版下（リソグラフ2色刷り用）</title>
<style>
/* ============================================================
   リソグラフ用 版下。1版につきA4 1ページ、すべて黒1色で出力する。
   色は印刷機のドラム側が乗せるので、色版の原稿も「黒」で刷る。
   ページ順: 各版とも [1] 黒版 → [2] 色版(ティールグリーン)
   ============================================================ */
@page{size:210mm 297mm;margin:0;}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{background:#fff;}
body{font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP","Meiryo",sans-serif;
  -webkit-font-smoothing:antialiased;}

.page{width:210mm;height:297mm;padding:11mm;background:#fff;color:#000;
  display:flex;flex-direction:column;overflow:hidden;position:relative;
  page-break-after:always;break-after:page;}
.page:last-child{page-break-after:auto;break-after:auto;}

/* ---------- 版面(実寸mm) ---------- */
.f-top{display:flex;align-items:center;justify-content:space-between;gap:4.1mm;}
.f-brand{font-size:11.3mm;font-weight:900;letter-spacing:-.02em;line-height:1;}
.f-sub{font-size:3.5mm;margin-top:2.3mm;letter-spacing:.02em;}
.f-badge{flex:none;text-align:center;border:1mm solid #000;border-radius:50%;
  width:37mm;height:37mm;display:flex;flex-direction:column;
  align-items:center;justify-content:center;line-height:1.12;}
.f-badge b{font-size:10.8mm;font-weight:900;display:block;letter-spacing:-.03em;}
.f-badge span{font-size:3.4mm;letter-spacing:.04em;margin-top:.5mm;}
.f-hr{height:.8mm;background:#000;margin:4.6mm 0 4.1mm;}
.f-head{font-size:8.6mm;font-weight:900;line-height:1.3;letter-spacing:-.01em;}
.f-head em{font-style:normal;}
.f-lede{margin-top:2.7mm;font-size:3.4mm;line-height:1.65;}
.f-area{margin-top:3.7mm;border-top:.5mm solid #000;border-bottom:.5mm solid #000;
  padding:2.5mm 0;display:flex;flex-direction:column;gap:1.5mm;}
.area-row{display:flex;align-items:baseline;gap:2.5mm;}
.area-lb{flex:none;width:17.4mm;font-size:2.9mm;font-weight:900;}
.area-v{font-size:3.6mm;font-weight:900;line-height:1.3;}
.area-row.sub .area-lb{font-size:2.7mm;}
.area-row.sub .area-v{font-size:3mm;font-weight:400;}
.f-chips{display:flex;gap:2mm;margin-top:3.1mm;}
.chip{flex:1;text-align:center;padding:1.5mm 0;font-size:3.1mm;font-weight:700;border:.5mm solid #000;}
.chip small{font-size:2.6mm;font-weight:400;margin-left:1mm;}
.f-pw{margin-top:4.1mm;display:flex;flex-direction:column;gap:2.3mm;}
.f-plabel{display:flex;align-items:center;gap:2.3mm;font-size:3.9mm;font-weight:900;letter-spacing:.05em;}
.f-plabel::after{content:"";flex:1;height:.5mm;background:#000;}
.phone{border:.9mm solid #000;border-radius:4.1mm;padding:2.5mm;display:flex;flex-direction:column;min-width:0;}
.phone-bar{display:flex;align-items:center;gap:1.5mm;padding-bottom:1.9mm;
  border-bottom:.4mm solid #000;margin-bottom:2.5mm;}
.avatar{width:6.4mm;height:6.4mm;border-radius:50%;flex:none;background:#000;color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:3.1mm;font-weight:900;}
.phone-name{font-size:3.1mm;font-weight:700;}
.phone-time{margin-left:auto;font-size:2.5mm;}
.bubble{border:.35mm solid #000;border-left:1.85mm solid #000;
  border-radius:2.7mm;border-top-left-radius:.8mm;padding:2.9mm;font-size:3.2mm;line-height:1.72;}
.b-title{font-weight:900;font-size:3.5mm;display:block;margin-bottom:1.9mm;}
.bubble h4{margin:2.5mm 0 .9mm;font-size:3.3mm;font-weight:900;}
.bubble h4:first-of-type{margin-top:0;}
.bubble .ev{font-weight:900;font-size:3.5mm;display:block;}
.bubble .when{display:block;margin-bottom:1mm;}
.bubble p{margin:0 0 1.2mm;}
.bubble p:last-child{margin-bottom:0;}
.bubble strong{font-weight:900;}
.tail{font-size:2.8mm;margin-top:1.9mm;}
.f-cta{display:flex;align-items:center;gap:4.5mm;margin-top:auto;padding-top:4.1mm;border-top:.8mm solid #000;}
.qr{width:34mm;height:34mm;flex:none;}
.qr img{width:100%;height:100%;display:block;image-rendering:pixelated;}
.cta-lead{font-size:5.4mm;font-weight:900;line-height:1.32;}
.cta-note{font-size:3.1mm;margin-top:1.4mm;line-height:1.55;}
.cta-url{font-size:4mm;font-weight:900;margin-top:1.8mm;letter-spacing:-.01em;}
.f-foot{margin-top:3mm;font-size:2.6mm;line-height:1.55;}

/* ---------- 版の出し分け ----------
   .p-k = 黒版: 黒で刷る要素だけ。色の要素は出さない。
   .p-c = 色版: 色で刷る要素だけを「黒」で出す。黒の要素は出さない。
   両方に同じ要素を出すと2度刷りになって濁るので、必ず排他にする。 */
.p-k .ci{visibility:hidden;}
.p-k .f-badge{border-color:transparent;}
.p-k .chip{border-color:transparent;}
.p-k .f-area{border-color:transparent;}
.p-k .f-hr,.p-k .avatar,.p-k .f-plabel::after{background:transparent;}
.p-k .avatar{color:transparent;}
.p-k .bubble{border-left-width:.35mm;}

.p-c .ki{visibility:hidden;}
.p-c .phone,.p-c .phone-bar,.p-c .f-cta,.p-c .bubble{border-color:transparent;}
.p-c .bubble{border-left-color:#000;}
.p-c .qr{visibility:hidden;}
</style></head><body>
