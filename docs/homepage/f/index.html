<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ぼんぼやーじゅ通信｜LINEで友だち追加</title>
<!-- チラシ流入計測用ランディング。印字URL: bonvoya.nicomaru.tokyo/f
     LINE友だち追加へ転送しつつ、流入元(flyer)を記録する。将来アクセス解析を入れたら ?from=flyer で計測可能。 -->
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;background:#FBFAF5;color:#34434C;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;}
.card{max-width:420px;width:100%;}
.brand{font-size:26px;font-weight:800;letter-spacing:1px;color:#2C7C9E;}
.sub{font-size:15px;color:#63727B;margin-top:6px;}
.lead{font-size:17px;line-height:1.6;margin:22px 0 20px;}
.btn{display:inline-block;background:#06C755;color:#fff;font-size:19px;font-weight:800;text-decoration:none;border-radius:999px;padding:16px 40px;box-shadow:0 8px 22px rgba(6,199,85,.28);}
.hint{font-size:13px;color:#8a97a0;margin-top:16px;line-height:1.6;}
a.home{color:#2C7C9E;font-size:13px;}
</style>
</head><body>
<div class="card">
  <div class="brand">ぼんぼやーじゅ通信</div>
  <div class="sub">花小金井まわりの 週末おでかけ便</div>
  <div class="lead">LINEで友だち追加すると、<br>毎週末のおでかけ情報がとどきます🎈<br>友だち追加で「花小金井 子連れおでかけガイド」もプレゼント。</div>
  <a class="btn" id="go" href="https://lin.ee/YtcfjnX">LINEで友だち追加</a>
  <div class="hint">自動でLINEにうつらない場合は、上のボタンを押してください。</div>
  <div class="hint"><a class="home" href="/">ホームページを見る →</a></div>
</div>
<script>
  // 流入元を記録（将来アクセス解析を入れたら from=flyer で計測できる）
  try { localStorage.setItem('bv_from', 'flyer'); localStorage.setItem('bv_from_at', new Date().toISOString()); } catch (e) {}
  // LINE友だち追加へ自動転送（少し待ってから。手動ボタンもある）
  setTimeout(function(){ location.href = document.getElementById('go').href; }, 1200);
</script>
</body></html>
