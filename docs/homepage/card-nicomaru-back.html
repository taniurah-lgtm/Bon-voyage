<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>名刺 裏（QR2つ）｜ニコマル</title>
<style>
/* 入稿用: 仕上がり 横91×55mm ＋ 塗り足し3mm = 97×61mm、トンボなし。 */
@page{size:97mm 61mm;margin:0;}
@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:97mm;height:61mm;}
body{font-family:"IPAPGothic","IPAGothic",sans-serif;-webkit-font-smoothing:antialiased;}
.card{position:relative;width:97mm;height:61mm;overflow:hidden;background:#FFFFFF;color:#2B3A42;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6mm;}
.lead{font-size:7.4pt;color:#63727B;letter-spacing:.3pt;}
.cols{display:flex;gap:7mm;margin-top:3mm;}
.col{width:33mm;text-align:center;}
.qrbox{width:22mm;height:22mm;margin:0 auto;background:#fff;border:.25mm solid #E4E9EC;border-radius:1.2mm;padding:.8mm;}
.qrbox img{width:100%;height:100%;display:block;}
.cname{font-size:8pt;font-weight:800;margin-top:1.6mm;letter-spacing:.2pt;}
.cname.bv{color:#2C7C9E;}
.cname.nm{color:#C07A2A;}
.cdesc{font-size:6.2pt;color:#8A98A0;margin-top:.6mm;line-height:1.5;}
.curl{font-size:6.2pt;color:#63727B;margin-top:.6mm;letter-spacing:.1pt;}
</style></head><body>
<div class="card">
  <div class="lead">ニコマルのしごと</div>
  <div class="cols">
    <div class="col">
      <div class="qrbox"><img src="assets/qr-nicomaru-site.png" alt="ニコマルQR"></div>
      <div class="cname nm">ニコマル</div>
      <div class="cdesc">国分寺の工房</div>
      <div class="curl">nicomaru.tokyo</div>
    </div>
    <div class="col">
      <div class="qrbox"><img src="assets/qr-bonvoya-site.png" alt="ぼんぼやーじゅ通信QR"></div>
      <div class="cname bv">ぼんぼやーじゅ通信</div>
      <div class="cdesc">花小金井の週末おでかけ便</div>
      <div class="curl">bonvoya.nicomaru.tokyo</div>
    </div>
  </div>
</div></body></html>
