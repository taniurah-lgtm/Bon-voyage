<!doctype html><html lang="ja"><head><meta charset="utf-8">

<!--

<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ width:1040px; height:1040px; }
  body{ font-family:"Zen Maru Gothic",sans-serif; background:#FFFDF7; color:#2A4B67; -webkit-font-smoothing:antialiased; }
  .page{ position:relative; width:1040px; height:1040px; overflow:hidden; background:#FFFDF7; }

  .balloon{ position:absolute; right:60px; top:22px; width:50px; }
  .left{ position:absolute; left:56px; top:206px; width:548px; z-index:3; }
  .catch{ font-family:"Zen Kurenaido",sans-serif; font-size:56px; line-height:1.25; color:#C88C5C;
          letter-spacing:.03em; paint-order:stroke fill; -webkit-text-stroke:.03em currentColor; white-space:nowrap; }
  .lead{ margin-top:22px; font-size:25px; line-height:1.6; font-weight:500; letter-spacing:.02em; }
  .chips{ display:flex; gap:10px; margin:12px 0 10px; }
  .chip{ font-size:22px; font-weight:700; color:#2C7C9E; background:#fff; border:2px solid #9FD0D2;
         border-radius:999px; padding:7px 14px 8px; white-space:nowrap; }
  .feat{ margin-top:24px; list-style:none; display:flex; flex-direction:column; gap:14px; }
  .feat li{ display:flex; align-items:flex-start; gap:14px; font-size:25px; line-height:1.45; font-weight:500; }

        display:flex; align-items:center; justify-content:center; font-size:21px; font-weight:700; margin-top:-2px; }
  .new .dot{ background:#FBEBDD; color:#C88C5C; }
  .newtag{ display:inline-block; font-size:17px; font-weight:700; color:#fff; background:#C88C5C;
           border-radius:6px; padding:2px 9px 3px; margin-right:8px; letter-spacing:.06em; vertical-align:3px; }
  .sub{ display:block; font-size:21px; color:#5C7487; margin-top:2px; }
  .go{ margin-top:40px; font-family:"Zen Kurenaido",sans-serif; font-size:33px; white-space:nowrap;
       color:#2A4B67; letter-spacing:.03em; }
  .go .arr{ display:inline-block; color:#C88C5C; margin-right:6px; }
  .hills{ position:absolute; left:-20px; width:1080px; bottom:-150px; opacity:.5; z-index:1; }
  .family{ position:absolute; left:84px; bottom:46px; height:128px; z-index:2; }
  .sun{ position:absolute; left:300px; bottom:118px; width:62px; opacity:.9; z-index:2; }
  .cap{ position:absolute; right:52px; top:190px; width:350px; text-align:center; font-size:18px;
        color:#5C7487; z-index:3; }
  .phone{ position:absolute; right:52px; top:220px; width:350px; height:780px; border-radius:40px;

          box-shadow:0 10px 0 rgba(42,75,103,.08); }
  .screen{ width:100%; height:100%; border-radius:28px; overflow:hidden; background:#FBF6EE; }
  .screen img{ width:100%; display:block; }
  .call{ position:absolute; z-index:4; left:476px; top:868px; display:flex; align-items:center; gap:4px; }
  .call .bubble{ background:#C88C5C; color:#fff; font-weight:700; font-size:20px; border-radius:999px;

<div class="page">

  <div class="cap">ページはこんな感じ（先週号）</div>
  <div class="phone"><div class="screen"><img src="shot-week-2026-10-14-pre.png" alt=""></div></div>
  <div class="call"><span class="bubble">NEW 📷 ここ</span>
    <svg width="58" height="24" viewBox="0 0 58 24"><path d="M2 12 C 16 5, 32 19, 52 12" stroke="#C88C5C" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M45 5 L54 12 L45 19" stroke="#C88C5C" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <img class="hills" src="../../homepage/assets/art/canva/hills.png" alt="">
