<script>
  const q = new URLSearchParams(location.search);
  const side = q.get('side') === 'back' ? 'back' : 'front';
  const bw = q.get('mode') === 'bw';
  if (bw) document.body.classList.add('bw');
  const page = document.getElementById('page');
  page.innerHTML = document.getElementById(side).innerHTML;
  if (bw) page.querySelectorAll('.flogo').forEach((i) => i.src = '../../homepage/assets/brand/logo-mono.png');
  if (q.get('qr')) page.querySelectorAll('.qrimg').forEach((i) => i.src = '../../homepage/assets/qr/' + q.get('qr'));

  // ── 花の枠（ロゴの花束を四隅に）──
  const A = window.FRAME_ART, INK = bw ? '#111' : '#2F3E48', PAPER = bw ? '#fff' : '#FBFAF5';
  const COL = bw ? { leaf: 'none', pink: 'none', gold: 'none', sky: 'none', red: 'none' }
                 : { leaf: '#A3CC93', pink: '#F3A9B9', gold: '#F2BE62', sky: '#A6D2E6', red: '#EE7C64' };
  const fills = (keys) => keys.map((k) => COL[k] === 'none' ? '' : `<path d="${A[k]}" fill="${COL[k]}"/>`).join('');
  // 花束の根もと（茎の下端）を角に置き、花が内側へ広がるように回す。sx<0 で左右反転
  const bouquet = (x, y, rot, len, mirror) => {
    const s = len / 616, sx = mirror ? -s : s;
    const t = `translate(${x} ${y}) rotate(${rot}) scale(${sx} ${s}) translate(-285 -897)`;
    return `<g transform="${t}"><path d="${A.bouquet}" fill="none" stroke="${PAPER}" stroke-width="16" stroke-linejoin="round"/>${fills(['leaf','pink','gold','sky'])}<path d="${A.bouquet}" fill="${INK}"/></g>`;
  };
  const balloon = (x, y, h, rot = 0) => {
    const s = h / 340; // 風船＋ひもの高さ（元の絵で約340）
    const t = `translate(${x} ${y}) rotate(${rot}) scale(${s}) translate(-585 -105)`;
    return `<g transform="${t}">${fills(['red'])}<path d="${A.balloon}" fill="${INK}"/></g>`;
  };
  // ── 花の枠（ロゴの花と葉を、細いつるに沿って並べる）──
  const PC = A.pieces;
  const piece = (name, x, y, rot, size) => {
    const p = PC[name], [x0, y0, x1, y1] = p.box, cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
    const s = size / Math.max(x1 - x0, y1 - y0);
    const f = ['leaf', 'pink', 'gold', 'sky'].map((k) => (p[k] && COL[k] !== 'none') ? `<path d="${p[k]}" fill="${COL[k]}"/>` : '').join('');
    return `<g transform="translate(${x.toFixed(2)} ${y.toFixed(2)}) rotate(${rot.toFixed(1)}) scale(${s.toFixed(4)}) translate(${-cx} ${-cy})"><path d="${p.ink}" fill="none" stroke="${PAPER}" stroke-width="14" stroke-linejoin="round"/>${f}<path d="${p.ink}" fill="${INK}"/></g>`;
  };
  // 角の丸い四角に沿った点（周長の割合 t → 位置と向き）
  const L = 15, T = 15, R = 195, B = 282, RR = 9;
  const W_ = R - L - 2 * RR, H_ = B - T - 2 * RR, PER = 2 * (W_ + H_) + 2 * Math.PI * RR;
  const at = (d) => {
    d = ((d % PER) + PER) % PER;
    const segs = [
      ['l', W_, (u) => [L + RR + u, T, 0]],
      ['a', Math.PI * RR / 2, (u) => { const a = -Math.PI / 2 + u / RR; return [R - RR + RR * Math.cos(a), T + RR + RR * Math.sin(a), a * 180 / Math.PI + 90]; }],
      ['l', H_, (u) => [R, T + RR + u, 90]],
      ['a', Math.PI * RR / 2, (u) => { const a = u / RR; return [R - RR + RR * Math.cos(a), B - RR + RR * Math.sin(a), a * 180 / Math.PI + 90]; }],
      ['l', W_, (u) => [R - RR - u, B, 180]],
      ['a', Math.PI * RR / 2, (u) => { const a = Math.PI / 2 + u / RR; return [L + RR + RR * Math.cos(a), B - RR + RR * Math.sin(a), a * 180 / Math.PI + 90]; }],
      ['l', H_, (u) => [L, B - RR - u, 270]],
      ['a', Math.PI * RR / 2, (u) => { const a = Math.PI + u / RR; return [L + RR + RR * Math.cos(a), T + RR + RR * Math.sin(a), a * 180 / Math.PI + 90]; }],
    ];
    for (const [, len, fn] of segs) { if (d <= len) return fn(d); d -= len; }
    return segs[0][2](0);
  };
  // つる（少しゆらす）
  let vine = '';
  for (let d = 0; d <= PER; d += 1) {
    const [x, y, ang] = at(d), w = 0.55 * Math.sin(d / 9) + 0.35 * Math.sin(d / 23);
    const nx = -Math.sin(ang * Math.PI / 180), ny = Math.cos(ang * Math.PI / 180);
    vine += `${d ? 'L' : 'M'}${(x + nx * w).toFixed(2)},${(y + ny * w).toFixed(2)}`;
  }
  let art = '';
  if (side === 'front' && q.get('frame') === 'vine') {
    art += `<path d="${vine}Z" fill="none" stroke="${INK}" stroke-width=".32" stroke-linecap="round"/>`;
    const seq = ['fpink', 'stop', 'sright', 'fgold', 'slow', 'fbud', 'lbig', 'fsky', 'stop', 'slow', 'fpink', 'sright', 'fbud', 'lbig', 'fgold', 'stop', 'fsky', 'slow'];
    const STEP = 17;
    let k = 0;
    for (let d = 4; d < PER - 6; d += STEP, k++) {
      const name = seq[k % seq.length], [x, y, ang] = at(d), flower = name[0] === 'f';
      const side_ = (k % 2 ? 1 : -1);
      const nx = -Math.sin(ang * Math.PI / 180) * side_, ny = Math.cos(ang * Math.PI / 180) * side_;
      const off = flower ? 0 : (side_ > 0 ? 2.6 : 1.4);
      const rot = flower ? (k * 47) % 360 : ang + (side_ > 0 ? 90 : -90) + ((k * 23) % 30 - 15);
      const size = flower ? (name === 'fbud' ? 7 : 13) : (name === 'lbig' ? 13 : 12);
      art += piece(name, x + nx * off, y + ny * off, rot, size);
    }
    art += balloon(143, 76, 26, 6);
  } else if (side === 'front') {
    // 2026-11-05 オーナーの参考画像（水彩の野の花の縁）をそのまま縁に使う
    page.insertAdjacentHTML('afterbegin', `<img class="wframe" src="../../homepage/assets/brand/${bw ? 'frame-watercolor-bw.png' : 'frame-watercolor.jpg'}" alt="">`);
    art += balloon(153, 62, 21, 6);
  }
  page.insertAdjacentHTML('afterbegin', `<svg class="art" viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg">${art}</svg>`);
  if (side === 'back') page.classList.add('back-page');
</script>
</body>
</html>
