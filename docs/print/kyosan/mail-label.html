<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>宛名ラベル（A4 12面）</title>
<!--
  2026-11-16。長3封筒に貼る宛名ラベル。A4 12面（1枚 86.4×42.3mm・上下21.5mm・左右18.6mm・すき間なし）。
  市販の12面ラベル（例: エーワン 28721）にそのまま刷れる。ラベルが無ければ普通紙に刷って切り、のりで貼ってもよい。
  中身は scripts/make-kyosan-mail.mjs が window.render([宛先…]) で差し込む。
  差出人のラベル（封筒の裏用）は render の2つめの引数に文字を渡したときだけ作る。🔒 差出人の住所はリポジトリに書かない。
-->
<style>
@page { size: A4; margin: 0; }
* { box-sizing: border-box; }
body { margin: 0; font-family: "Noto Sans JP", sans-serif; color: #111; }
.sheet { width: 210mm; height: 297mm; padding: 21.5mm 18.6mm; display: grid; grid-template-columns: 86.4mm 86.4mm; grid-auto-rows: 42.3mm; page-break-after: always; }
.l { padding: 4mm 5mm 3mm 6mm; overflow: hidden; display: flex; flex-direction: column; }
.zip { font-size: 10.5pt; letter-spacing: .05em; }
.addr { font-size: 9.5pt; line-height: 1.45; margin-top: .8mm; }
.to { font-size: 12.5pt; font-weight: 700; margin-top: auto; line-height: 1.35; }
.to small { font-size: 9pt; font-weight: 400; display: block; }
.to .h { font-size: 11pt; font-weight: 400; margin-left: 2mm; }
.from { font-size: 9pt; line-height: 1.55; white-space: pre-line; padding-top: 6mm; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
window.render = (list, from) => {
  const cells = list.map((r) => `<div class="l">
    <div class="zip">〒${esc(r.zip)}</div>
    <div class="addr">${esc(r.addr)}${r.addr2 ? `<br>${esc(r.addr2)}` : ''}</div>
    <div class="to">${r.sub ? `<small>${esc(r.sub)}</small>` : ''}${esc(r.to)}<span class="h">${esc(r.honor || '御中')}</span></div>
  </div>`);
  const sheets = [];
  for (let i = 0; i < cells.length; i += 12) sheets.push(`<div class="sheet">${cells.slice(i, i + 12).join('')}</div>`);
  if (from) sheets.push(`<div class="sheet">${Array.from({ length: 12 }, () => `<div class="l from">${esc(from)}</div>`).join('')}</div>`);
  document.getElementById('root').innerHTML = sheets.join('');
};
if (!location.search.includes('blank')) window.render([{ zip: '187-0002', addr: '東京都小平市花小金井1-1-1', to: '（見本）〇〇店' }]);
</script>
</body>
</html>
